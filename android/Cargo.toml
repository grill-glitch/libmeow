[package]
name = "meow-android"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Android JNI bridge for the meow-rs kernel (libmeow)."

[lib]
name = "meow"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
tokio = { version = "1", features = ["full"] }
log = "0.4"
android_logger = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1"

meow-common = { path = "../third_party/meow-rs/crates/meow-common" }
meow-config = { path = "../third_party/meow-rs/crates/meow-config" }
meow-dns = { path = "../third_party/meow-rs/crates/meow-dns", default-features = false }
meow-tunnel = { path = "../third_party/meow-rs/crates/meow-tunnel" }
meow-proxy = { path = "../third_party/meow-rs/crates/meow-proxy" }
meow-listener = { path = "../third_party/meow-rs/crates/meow-listener", default-features = false, features = ["listener-tun"] }
